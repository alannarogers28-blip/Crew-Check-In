<style>
/* Layout: two views on one page. "Take it" is one question per screen, phone-first. "Manager" is a scannable report: summary first, detail after. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface2:#ECEAE3; --fg:#1C1C1A; --muted:#5F5E5A; --line:#DAD8D0;
  --accent:#0F6E56; --accent-soft:#E1F5EE; --accent-deep:#04342C; --accent-fg:#FFFFFF;
  --blue-soft:#E6F1FB; --blue-fg:#0C447C; --amber-soft:#FAEEDA; --amber-fg:#633806; --purple-soft:#EEEDFE; --purple-fg:#3C3489; --red-soft:#FCEBEB; --red-fg:#791F1F;
  --l0:#ECEAE3; --l0fg:#5F5E5A; --l1:#D7EFE6; --l1fg:#0F6E56; --l2:#9FDCC6; --l2fg:#04342C; --l3:#1D9E75; --l3fg:#FFFFFF; --l4:#085041; --l4fg:#FFFFFF;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --surface:#201F1D; --surface2:#2A2927; --fg:#ECEAE3; --muted:#A8A69E; --line:#3A3936;
  --accent:#4FC39A; --accent-soft:#113D31; --accent-deep:#C9F1E2; --accent-fg:#071A13;
  --blue-soft:#13293D; --blue-fg:#9CC9F0; --amber-soft:#3B2A0E; --amber-fg:#F2C27B; --purple-soft:#26245A; --purple-fg:#C9C5F5; --red-soft:#3D1414; --red-fg:#F4A3A3;
  --l0:#2A2927; --l0fg:#A8A69E; --l1:#1B3A30; --l1fg:#9FDCC6; --l2:#1F6B50; --l2fg:#E1F5EE; --l3:#2EAB82; --l3fg:#071A13; --l4:#8FE3C3; --l4fg:#071A13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --surface:#201F1D; --surface2:#2A2927; --fg:#ECEAE3; --muted:#A8A69E; --line:#3A3936;
  --accent:#4FC39A; --accent-soft:#113D31; --accent-deep:#C9F1E2; --accent-fg:#071A13;
  --blue-soft:#13293D; --blue-fg:#9CC9F0; --amber-soft:#3B2A0E; --amber-fg:#F2C27B; --purple-soft:#26245A; --purple-fg:#C9C5F5; --red-soft:#3D1414; --red-fg:#F4A3A3;
  --l0:#2A2927; --l0fg:#A8A69E; --l1:#1B3A30; --l1fg:#9FDCC6; --l2:#1F6B50; --l2fg:#E1F5EE; --l3:#2EAB82; --l3fg:#071A13; --l4:#8FE3C3; --l4fg:#071A13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:20px}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:-0.01em;text-wrap:balance;margin:0}
h1{font-size:24px}h2{font-size:19px}h3{font-size:15px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:500;font-size:14px;background:var(--surface)}
nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;text-align:center}
button.ghost{border:none;background:none;color:var(--accent);font-weight:500;padding:6px 0;min-height:0}
button.opt{width:100%;display:block}
button.opt:hover,button.opt.on{background:var(--accent-soft);border-color:var(--accent)}
button.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:999px}
button.sm.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{min-height:88px;text-align:center;font-size:18px;font-weight:600;font-family:var(--font-head)}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;line-height:1.5;white-space:nowrap}
.c-acc{background:var(--accent-soft);color:var(--accent-deep)}.c-blue{background:var(--blue-soft);color:var(--blue-fg)}.c-amber{background:var(--amber-soft);color:var(--amber-fg)}.c-purple{background:var(--purple-soft);color:var(--purple-fg)}.c-gray{background:var(--surface2);color:var(--muted)}.c-red{background:var(--red-soft);color:var(--red-fg)}
.lv0{background:var(--l0);color:var(--l0fg)}.lv1{background:var(--l1);color:var(--l1fg)}.lv2{background:var(--l2);color:var(--l2fg)}.lv3{background:var(--l3);color:var(--l3fg)}.lv4{background:var(--l4);color:var(--l4fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
input[type=text],textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:90px}
.type{font-family:var(--font-head);font-size:44px;font-weight:600;letter-spacing:.02em;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.err{color:var(--red-fg);font-size:13px}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.clean li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.private{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.timer{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
@media (prefers-reduced-motion:no-preference){.timer i.run{animation:tick 3s linear forwards}@keyframes tick{from{transform:scaleX(1)}to{transform:scaleX(0)}}}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent-deep);border-radius:0 10px 10px 0;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.scroll{overflow-x:auto;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .n{font-family:var(--font-head);font-size:26px;font-weight:600;line-height:1.1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.cmt{border-left:3px solid var(--line);padding:6px 10px;font-size:14px}
.reply{margin-left:14px;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{font-weight:500;color:var(--muted)}
</style>

<script>
// ============ SETUP (the only two lines to change) ============
// SHEET_URL: the web-app URL from your Google Sheet's Apps Script deployment. Leave "" and results travel by copy-and-text instead.
// MANAGER_KEY: the same key you put in the Apps Script. Only someone with it can load submissions in the manager tab.
const CONFIG={SHEET_URL:"",MANAGER_KEY:"",MANAGER_EMAIL:"alanna.rogers.28@gmail.com",PAGE_URL:"https://alannarogers28-blip.github.io/Crew-Check-In/"};
// Personal links: PAGE_URL + "#firstname-AGE-ROLE", e.g. #riley-16-crew. AGE is 14, 16 or 18; ROLE is crew, baker or lead.
function personFromHash(){const m=(location.hash||"").slice(1).match(/^([a-z][a-z-]*?)-(14|16|18)-(crew|baker|lead)$/);if(!m)return null;return{name:m[1].split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" "),age:parseInt(m[2],10),role:m[3],slug:m[0]}}

// ============ PART 1: WORK STYLE QUIZ ============
const RAPID=[["W1","Call or text?",[["A","Call","E"],["B","Text","I"]]],["W2","Big party or movie night?",[["A","Party","E"],["B","Movie","I"]]],["W3","Follow the recipe or wing it?",[["A","Recipe","S"],["B","Wing it","N"]]],["W4","Directions: street names or \"turn at the gas station\"?",[["A","Street names","S"],["B","Gas station","N"]]],["W5","Fair or kind?",[["A","Fair","T"],["B","Kind","F"]]],["W6","Head or heart?",[["A","Head","T"],["B","Heart","F"]]],["W7","Plan it or play it by ear?",[["A","Plan","J"],["B","By ear","P"]]],["W8","Alarm set or wake up whenever?",[["A","Alarm","J"],["B","Whenever","P"]]],["W9","Early bird or night owl?",[["A","Early bird",null,null,null,"opener"],["B","Night owl",null,null,null,"closer"]]],["W10","Iced or hot, even in January?",[["A","Iced",null,null,null,"fun"],["B","Hot",null,null,null,"fun"]]]];
const FUNNY=[["F1","Your go-to order when it's free:",[["A","Same thing every time. I don't mess with what works","S"],["B","Whatever's new on the board","N"],["C","The most expensive thing, obviously","T"],["D","Something I can share with whoever's on break","F"],["E","Depends on the weather and my mood","P"],["F","Type it yourself",null,null,null,"text"]]],["F2","The lobby TV is yours for an hour. What's on?",[["A","Sports","E"],["B","Cartoons","P"],["C","A cooking show I'll critique out loud","T"],["D","A nature documentary I will narrate","N"],["E","Whatever the customers want, I take requests","F"],["F","A documentary about how things get made","S"]]],["F3","Your drive-thru voice:",[["A","Radio host","E"],["B","Customer service robot","J"],["C","Same as my regular voice, unfortunately","I"],["D","Depends how the morning's going","P"],["E","Slightly more polite than I am in real life","F"],["F","Fast and clear, I'm not here to chat","T"]]],["F4","Your walk-up song for clocking in:",[["A","Something hype. Everyone needs to know I'm here","E"],["B","Something chill, I'm easing in","I"],["C","A different one for every mood, I have playlists","P"],["D","The same song every single time","J"],["E","Whatever's already on the lobby speaker, I'm not picky","F"],["F","Type it yourself",null,null,null,"text"]]],["F5","A customer calls you \"boss.\" You:",[["A","Feel powerful","T"],["B","Feel weird about it","I"],["C","Want to give them a free donut","F"],["D","Say \"that's me\" with zero hesitation","E"],["E","Correct them. Technically it's \"shift lead\"","S"],["F","Wonder what being the boss would actually take","N"]]],["F6","Which could you survive longer without?",[["A","My phone","I"],["B","Coffee","S"],["C","Sleep","P"],["D","Trick question, none of these","N"],["E","My coworkers (kidding, don't tell them)","E"],["F","My alarm, as long as someone calls to wake me up","F"]]],["F7","Pick your shift superpower:",[["A","Never dropping a drink again","S"],["B","Reading minds at the headset","N"],["C","Teleporting to the back for restock","I"],["D","Ending every rush in ten minutes","T"],["E","Knowing every regular's order before they say it","F"],["F","Making the whole crew laugh mid-rush","E"]]]];
const TEST=[["Q1","EI","It's Friday night after a long week. What actually recharges you?",[["A","Having people over or going out. Being around friends fills me up","E"],["B","One close friend, something low-key","I"],["C","Alone with my show, my music, or my game","I"],["D","Doesn't matter where, as long as something's going on","E"],["E","Working a shift, to be honest. I like the energy of a busy store","E"],["F","Cooking or working on something by myself with music on","I"]]],["Q2","EI","You're put on front counter for a slow mid-afternoon. How do you feel about it?",[["A","Great. I'll chat with regulars and make the time fly","E","Customer warmth"],["B","Fine. I'll restock and wipe down between customers","I","Initiative"],["C","I'd rather be on sandwich or beverage where I can focus","I"],["D","I'd ask to swap to drive-thru so I'm talking to more people","E"],["E","I'll learn the regulars' names and orders so I know them next time","E","Customer warmth"],["F","I'll reorganize the front so the next rush goes smoother","I","Initiative"]]],["Q3","EI","Group project, first meeting. You're most likely the one who:",[["A","Starts talking first and gets everyone going","E","Initiative"],["B","Listens, then says the one thing that organizes the plan","I","Precision"],["C","Volunteers for the part you can do on your own","I","Follow-through"],["D","Keeps the group chat alive and makes sure everyone's in","E","Team-first"],["E","Asks what everyone's good at and hands out the parts","E","Ownership"],["F","Does the research before the next meeting so there's something to work with","I","Initiative"]]],["Q4","EI","A customer at the counter wants to tell you about their whole morning. The line is short. You:",[["A","Lean in. This is the best part of the job","E","Customer warmth"],["B","Smile, nod, and gently steer back to the order","I","Composure"],["C","Listen, but feel drained afterward","I"],["D","Pull a coworker into the conversation too","E","Team-first"],["E","Ask a follow-up question. People remember when you actually listen","E","Customer warmth"],["F","Keep working while they talk so the order's ready the second they finish","I","Initiative"]]],["Q5","EI","Your phone's blowing up with a group chat about weekend plans. You:",[["A","Jump in right away with ideas","E"],["B","Read it all, reply once with an actual plan","I","Follow-through"],["C","Mute it and catch up later","I"],["D","Call someone instead of typing","E"],["E","Suggest we all just meet up and figure it out in person","E"],["F","Thumbs-up and go with whatever gets decided","I","Team-first"]]],["Q6","EI","Break time during a long shift. You'd rather:",[["A","Sit with whoever's on break and talk","E"],["B","Step outside alone with headphones","I"],["C","Scroll in the back, not really talking","I"],["D","Check the floor and see if anyone needs anything","E","Initiative"],["E","Call or FaceTime someone","E"],["F","Eat quietly and reset. I'll be sharper for the second half","I","Composure"]]],["Q7","EI","You're assigned to present in class. Inside, you're:",[["A","Kind of excited. I like having the room","E"],["B","Fine once I start, dreading it until then","I"],["C","Wishing I could just turn in the paper instead","I"],["D","Already thinking about how to make it funny","E"],["E","Asking if I can do it as a group. I'm better bouncing off people","E","Team-first"],["F","Over-preparing so I never have to wing a single second of it","I","Precision"]]],["Q8","EI","New coworker's first shift, and nobody was assigned to show them around. You:",[["A","Introduce yourself and bring them along with you","E","Initiative"],["B","Say hi and show them your station when they come by","I"],["C","Wait for the lead to assign someone","I",null,"Waits to be told"],["D","Walk them around and introduce them to everyone on shift","E","Team-first"],["E","Ask the lead if I can be the one to train them","E","Ownership"],["F","Make them a cheat sheet of where everything is","I","Precision"]]],["Q9","SN","Someone shows you how to make a drink you've never made. What sticks?",[["A","The exact steps, in order. I'll do it the same way every time","S","Precision"],["B","Why each step matters, then I can adapt it","N"],["C","I need to do it myself a couple of times before it's real","S"],["D","The pattern. It's basically the other one but with X","N"],["E","I write the steps in my phone and check it until I don't need to","S","Follow-through"],["F","I taste it and work backward from what it's supposed to taste like","N"]]],["Q10","SN","Planning a trip with friends. You're the one who:",[["A","Finds the actual times, prices, and addresses","S","Follow-through"],["B","Comes up with the idea nobody else thought of","N","Initiative"],["C","Makes sure the plan works in real life","S","Precision"],["D","Thinks about what would make it memorable","N"],["E","Makes the group chat poll so everyone actually commits","S","Team-first"],["F","Spots the problem with the plan before anyone else does","N","Precision"]]],["Q11","SN","It's 10:40 and the morning rush is tapering off. What are you thinking?",[["A","Time to restock exactly what we're low on","S","Initiative"],["B","We should start prepping for lunch before it hits","N","Initiative"],["C","I'll do whatever the lead says is next","S"],["D","I'm already thinking about how to make tomorrow's rush smoother","N"],["E","Check sandwich and beverage counts against what we'll need","S","Precision"],["F","Notice who's dragging and swap stations so nobody burns out","N","Team-first"]]],["Q12","SN","A teacher gives vague instructions for an assignment. You:",[["A","Ask exactly what they want: length, format, due date","S","Precision"],["B","Make your best interpretation and run with it","N"],["C","Look at what people did last year","S"],["D","Take it somewhere interesting and see if they like it","N"],["E","Email the teacher after class with my understanding and ask if it's right","S","Ownership"],["F","Start with the part I'm sure about and let the rest take shape","N","Initiative"]]],["Q13","SN","The recipe card says 3 pumps, but the drink always tastes off to you. You:",[["A","Make it exactly as written. The card is the card","S","Follow-through"],["B","Mention it to the lead and ask if the card is right","S","Ownership"],["C","Try 2.5 pumps and see if customers like it better","N",null,"Goes it alone"],["D","Figure out why (syrup batch, ice amount) and tell someone","N","Initiative"],["E","Ask a coworker to taste it with me so it's not just my opinion","S","Team-first"],["F","Check whether the card's out of date. Maybe the recipe changed","N","Precision"]]],["Q14","SN","You remember a movie mostly by:",[["A","Specific scenes and lines","S"],["B","The overall feeling and what it meant","N"],["C","The details that didn't make sense","S","Precision"],["D","What I'd have done differently with the ending","N"],["E","The soundtrack and what the characters wore","S"],["F","The theme. What it was really about underneath","N"]]],["Q15","SN","Lead says \"the lobby looks rough.\" You see:",[["A","Three tables need wiping, trash is at 80%, napkins are out","S","Precision"],["B","The flow is wrong. The condiment station should move","N"],["C","I'll start at one end and work across","S","Follow-through"],["D","Someone needs to be assigned to lobby every hour","N","Initiative"],["E","Ask what \"rough\" means: floors, tables, or trash?","S","Coachable"],["F","Wonder why it got rough. Are we skipping lobby checks during the rush?","N"]]],["Q16","SN","You learn best when:",[["A","Someone walks me through it step by step","S"],["B","I get the big idea first, then fill in the rest","N"],["C","I can practice with real examples","S"],["D","I can connect it to something I already know","N"],["E","I watch someone do it, then copy exactly","S"],["F","I ask \"what happens if\" questions until I get the system","N"]]],["Q17","TF","A coworker is on their phone in the back during the rush. You:",[["A","Say \"hey, 'd do instead and let them decide","T"]]],["Q21","TF","A customer is wrong about their order but insists. The line's building. You:",[["A","Fix it their way and move on. Speed matters more than being right","T","Composure"],["B","Apologize warmly, fix it, make sure they leave happy","F","Customer warmth"],["C","Explain politely what they ordered, then fix it anyway","T"],["D","Get the lead. I don't want it to turn into something","F"],["E","Fix it fast and throw in a \"sorry about that\" even if it wasn't us","F","Customer warmth"],["F","Fix it, then quietly check the ticket so we know what actually happened","T","Precision"]]],["Q22","TF","A coach or teacher corrects you in front of everyone. You:",[["A","Nod, fix it, move on","T","Coachable"],["B","Fix it, but it bugs me for the rest of the day","F",null,"Takes it personally"],["C","Ask a question so I actually get it right","T","Coachable"],["D","Feel embarrassed, but appreciate that they cared enough","F","Coachable"],["E","Say \"my bad\" out loud so it's not a thing","F","Ownership"],["F","Fix it, then later ask what they'd want me to do differently next time","T","Initiative"]]],["Q23","TF","A regular tips you $5. Your coworker made most of the order. You:",[["A","Split it. They did the work","T","Ownership"],["B","Hand it over. They earned it, and it means more to them","F","Team-first"],["C","Ask what the store policy is and follow that","T","Follow-through"],["D","Put it in the shared jar","F","Team-first"],["E","Keep it this time, hand over the next one. It evens out","T"],["F","Tell them the regular tipped because of their order, and let them have it","F","Ownership"]]],["Q24","TF","The group chat is dragging someone you're friends with. You:",[["A","Say \"not cool\" in the chat","T","Ownership"],["B","Message your friend privately to check on them","F","Team-first"],["C","Leave the chat","F",null,"Avoids hard conversations"],["D","Ask what the actual issue is. Maybe there's something real","T"],["E","Say   const poss=possible(),picks=Object.fromEntries(STRENGTHS.map(s=>[s,0])),gp=Object.fromEntries(GROWTH.map(g=>[g,0]));
  test.forEach(q=>{const o=pick(q,a);if(o&&o.strength)picks[o.strength]++;if(o&&o.growth)gp[o.growth]++});
  const strengths=STRENGTHS.map(s=>({s,picks:picks[s],possible:poss[s],share:poss[s]?picks[s]/poss[s]:0})).sort((p,q)=>q.share-p.share||q.picks-p.picks);

function needList(ca,role,age){
  const steps=buildSteps(role,age);const out=[];
  steps.filter(s=>s.id.startsWith("a1:")).forEach(s=>{const v=ca[s.id];if(v==="Haven't learned it"||v==="Learning it")out.push({t:s.station,why:v})});
  steps.filter(s=>s.kind==="tasks").forEach(s=>{const o=ca[s.id]||{};Object.entries(o).forEach(([t,v])=>{if(v==="Don't know")out.push({t:`${t} (${s.id.slice(2)})`,why:"don't know"})})});
  D.forEach(([id,p])=>{if((ca[id]||"").trim().toUpperCase()==="N/A")out.push({t:p,why:"N/A"})});
  [...F_ALL,...F_ADULT,...F_MINOR].forEach(([id,p])=>{const v=ca[id];if(v==="No, teach me"||v==="Kind of")out.push({t:p.replace(/^Do you know /,"").replace(/\?$/,""),why:v.toLowerCase()})});
  return out;
}
